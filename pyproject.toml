[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "azure-bing-assistant"
version = "0.1.0"
description = "Azure Bing Assistant installer and web application"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "aiohttp>=3.14.3,<4",
  "azure-ai-projects==2.0.1",
  "azure-identity>=1.19,<2",
  "fastapi>=0.115,<1",
  "openai>=2.8,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[project.scripts]
azure-bing-assistant = "azure_bing_assistant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/azure_bing_assistant"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = [".", "src"]
