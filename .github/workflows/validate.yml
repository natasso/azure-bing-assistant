name: Validate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build wheel and source distribution
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build
      - name: Install built wheel
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          python -m pip install --disable-pip-version-check "${wheel}[test]"
          python -c "import aiohttp, azure_bing_assistant; assert tuple(map(int, aiohttp.__version__.split('.')[:3])) >= (3, 14, 3)"
      - name: Syntax
        run: python -m compileall -q src app tests
      - name: CLI
        run: |
          azure-bing-assistant --help
          python -m azure_bing_assistant --help
      - name: Test
        run: python -m pytest
      - name: Validate Bicep
        run: |
          az bicep install
          az bicep build --file ./infra/main.bicep --stdout >/dev/null
